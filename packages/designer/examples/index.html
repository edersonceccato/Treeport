<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Treeport Designer</title>
    <style>
      * { box-sizing: border-box; }

      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        margin: 0;
        background: #f1f3f7;
        color: #1f2937;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .appbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid #d8dce2;
        flex: 0 0 auto;
      }

      .brand {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .brand span { color: #2563eb; }

      .doc-name {
        font-size: 12px;
        color: #6b7280;
        padding: 4px 8px;
        border: 1px solid transparent;
        border-radius: 4px;
      }

      .doc-name:hover { border-color: #d8dce2; }

      .appbar .spacer { flex: 1; }

      .appbar button {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border: 1px solid #d8dce2;
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
      }

      .appbar button:hover { border-color: #2563eb; color: #2563eb; }

      .appbar button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }

      .appbar button.primary:hover { background: #1d4ed8; color: #fff; }

      main { flex: 1 1 auto; min-height: 0; padding: 12px 16px 16px; }

      treeport-designer { height: 100%; }

      /* modal do JSON */
      dialog {
        border: none;
        border-radius: 10px;
        padding: 0;
        width: min(720px, 90vw);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
      }

      dialog::backdrop { background: rgba(15, 23, 42, 0.45); }

      .dlg-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
      }

      .dlg-head h2 { margin: 0; font-size: 13px; }

      .dlg-head button {
        font: inherit;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 16px;
        color: #6b7280;
      }

      pre {
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 11px;
        line-height: 1.5;
        max-height: 60vh;
        overflow: auto;
        border-radius: 0 0 10px 10px;
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <div class="brand">Tree<span>port</span></div>
      <input class="doc-name" id="nome" value="Relatório de Pedidos" />
      <div class="spacer"></div>
      <button id="json">Ver JSON</button>
      <button id="import">Importar</button>
      <button id="export">Exportar</button>
      <button class="primary" id="save">Salvar</button>
    </header>

    <main>
      <treeport-designer id="designer"></treeport-designer>
    </main>

    <dialog id="dlg">
      <div class="dlg-head">
        <h2>JSON do template</h2>
        <button id="fechar">✕</button>
      </div>
      <pre id="saida"></pre>
    </dialog>

    <input type="file" id="arquivo" accept="application/json" hidden />

    <script type="module">
      import '../src/index.ts';
      import { exportTemplate, importTemplate } from '../src/index.ts';

      const designer = document.getElementById('designer');

      // --- fonte de dados: alimenta o painel "Dados" ---
      designer.dataSource = {
        id: 'pedidos',
        name: 'Pedidos',
        parameters: [{ name: 'pedidoId', type: 'int', nullable: false, testValue: 1 }],
        root: {
          id: 'PEDIDO',
          name: 'Pedido',
          sql: 'SELECT * FROM pedido WHERE id = :pedidoId',
          fields: ['numero', 'cliente', 'emitido', 'total', 'observacao'],
          children: [
            {
              id: 'ITEM',
              name: 'Itens do pedido',
              sql: 'SELECT * FROM item WHERE pedido_id IN (:parentValues)',
              fields: ['descricao', 'quantidade', 'valor_unitario', 'valor_total'],
              linkFields: { parentField: 'id', childField: 'pedidoId' },
            },
          ],
        },
      };

      // --- template inicial ---
      designer.template = {
        id: 'demo',
        name: 'Relatório de Pedidos',
        boundDataSourceNodeId: 'PEDIDO',
        pageSize: 'A4',
        margins: { top: 40, right: 40, bottom: 40, left: 40 },
        bands: {
          header: {
            height: 60,
            elements: [
              {
                id: 'titulo',
                type: 'label',
                x: 0,
                y: 4,
                width: 340,
                height: 24,
                content: 'Relatório de Pedidos',
                style: { fontSize: 18, bold: true },
              },
              {
                id: 'sub',
                type: 'label',
                x: 0,
                y: 30,
                width: 340,
                height: 14,
                content: 'Emitido para {{cliente}}',
                style: { fontSize: 10, color: '#6b7280' },
              },
              {
                id: 'regua',
                type: 'line',
                x: 0,
                y: 56,
                width: 515,
                height: 0,
                orientation: 'horizontal',
                style: { borderColor: '#334155', borderWidth: 1 },
              },
            ],
          },
          details: {
            height: 120,
            elements: [
              {
                id: 'lista',
                type: 'subreport',
                name: 'Pedidos',
                x: 0,
                y: 0,
                width: 515,
                height: 110,
                canGrow: true,
                dataSourceNodeId: 'PEDIDO',
                template: {
                  // cabeçalho: aparece UMA vez, com os títulos das colunas
                  header: {
                    height: 18,
                    elements: [
                      { id: 'h1', type: 'label', x: 0, y: 2, width: 120, height: 11,
                        content: 'Número', style: { fontSize: 9, bold: true, color: '#475569' } },
                      { id: 'h2', type: 'label', x: 130, y: 2, width: 240, height: 11,
                        content: 'Cliente', style: { fontSize: 9, bold: true, color: '#475569' } },
                      { id: 'h3', type: 'label', x: 380, y: 2, width: 135, height: 11,
                        content: 'Total', style: { fontSize: 9, bold: true, color: '#475569', align: 'right' } },
                      { id: 'h4', type: 'line', x: 0, y: 15, width: 515, height: 0,
                        orientation: 'horizontal', style: { borderColor: '#94a3b8', borderWidth: 0.75 } },
                    ],
                  },
                  // corpo: repete uma vez por linha
                  details: {
                    height: 15,
                    elements: [
                      { id: 'c1', type: 'field', x: 0, y: 2, width: 120, height: 11,
                        fieldName: 'numero', style: { fontSize: 9 } },
                      { id: 'c2', type: 'field', x: 130, y: 2, width: 240, height: 11,
                        fieldName: 'cliente', style: { fontSize: 9 } },
                      { id: 'c3', type: 'field', x: 380, y: 2, width: 135, height: 11,
                        fieldName: 'total', format: '#,##0.00', style: { fontSize: 9, align: 'right' } },
                    ],
                  },
                  // rodapé: fecha a lista com o total
                  footer: {
                    height: 20,
                    elements: [
                      { id: 'f1', type: 'line', x: 0, y: 2, width: 515, height: 0,
                        orientation: 'horizontal', style: { borderColor: '#94a3b8', borderWidth: 0.75 } },
                      { id: 'f2', type: 'label', x: 250, y: 5, width: 120, height: 12,
                        content: 'Total geral', style: { fontSize: 9, bold: true, align: 'right' } },
                      { id: 'f3', type: 'aggregate', x: 380, y: 5, width: 135, height: 12,
                        fn: 'sum', fieldName: 'total', format: '#,##0.00',
                        style: { fontSize: 9, bold: true, align: 'right' } },
                    ],
                  },
                },
              },
            ],
          },
          footer: {
            height: 60,
            elements: [
              {
                id: 'linha-rodape',
                type: 'line',
                x: 0,
                y: 0,
                width: 515,
                height: 0,
                orientation: 'horizontal',
                style: { borderColor: '#cbd5e1', borderWidth: 0.5 },
              },
              {
                id: 'paginacao',
                type: 'label',
                x: 200,
                y: 8,
                width: 115,
                height: 12,
                content: 'Página {{sys.pageNumber}} de {{sys.totalPages}}',
                style: { fontSize: 9, align: 'center', color: '#6b7280' },
              },
              {
                id: 'gerado',
                type: 'label',
                x: 0,
                y: 8,
                width: 180,
                height: 12,
                content: 'Gerado pelo Treeport',
                style: { fontSize: 8, color: '#9ca3af' },
              },
              {
                id: 'total-geral',
                type: 'aggregate',
                x: 340,
                y: 6,
                width: 175,
                height: 16,
                fn: 'sum',
                fieldName: 'total',
                format: '#,##0.00',
                prefix: 'Total geral: R$ ',
                style: { fontSize: 10, bold: true, align: 'right' },
              },
              {
                id: 'bc',
                type: 'barcode',
                x: 0,
                y: 24,
                width: 150,
                height: 30,
                format: 'code128',
                valueExpression: 'PED-2026-0001',
                includeText: true,
              },
              {
                id: 'qr',
                type: 'qrcode',
                x: 170,
                y: 24,
                width: 32,
                height: 32,
                contentKind: 'url',
                valueExpression: 'https://exemplo.com/pedidos',
                errorCorrection: 'M',
              },
              {
                id: 'estrela',
                type: 'shape',
                x: 220,
                y: 24,
                width: 32,
                height: 32,
                shape: 'star',
                style: { backgroundColor: '#fbbf24', borderColor: '#d97706', borderWidth: 1 },
              },
            ],
          },
        },
      };

      // --- barra do app ---
      const dlg = document.getElementById('dlg');

      document.getElementById('json').onclick = () => {
        document.getElementById('saida').textContent = exportTemplate(designer.template);
        dlg.showModal();
      };
      document.getElementById('fechar').onclick = () => dlg.close();

      document.getElementById('export').onclick = () => {
        const blob = new Blob([exportTemplate(designer.template)], {
          type: 'application/json',
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${designer.template.id}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
      };

      const arquivo = document.getElementById('arquivo');
      document.getElementById('import').onclick = () => arquivo.click();
      arquivo.onchange = async () => {
        const file = arquivo.files?.[0];
        if (!file) return;
        try {
          designer.template = importTemplate(await file.text());
        } catch (err) {
          alert(err.message);
        }
        arquivo.value = '';
      };

      document.getElementById('save').onclick = () => {
        // aqui a aplicação real chamaria a API:
        //   await api.saveTemplate(designer.template)
        alert('Num app real isto chamaria POST/PUT /report-templates.');
      };

      document.getElementById('nome').onchange = (e) => {
        designer.api.updateTemplate({ name: e.target.value });
      };

      designer.addEventListener('template-change', (e) => {
        document.getElementById('nome').value = e.detail.template.name;
      });
    </script>
  </body>
</html>
